[build]
  command = "npm run build"
  publish = "dist"

# SPA rewrite: every path that is not a real file gets index.html,
# so deep links like /full-stack resolve on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
