    <script>
      // Paint the saved theme before the first frame, otherwise light-mode
      // visitors get a flash of the dark site while React boots. Must stay in
      // sync with THEME_KEY in src/lib/hooks.js.
      (function () {
        var light = false;
        try {
          var stored = localStorage.getItem('am-theme');
          light = stored
            ? stored === 'light'
            : window.matchMedia('(prefers-color-scheme: light)').matches;
        } catch (e) {
          light = false;
        }
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', light ? '#f3efe8' : '#1a1818');
      })();
    </script>
